{% extends "base.html" %}
{% block title %}{{ t('change_password_title') }}{% endblock %}

{% block content %}
<h1>{{ t('change_password_title') }}</h1>

{% if error %}<p class="error">{{ t(error) }}</p>{% endif %}

<form method="post" action="/profile/change-password" class="stacked-form narrow">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>{{ t('change_password_current_label') }}
        <input type="password" name="current_password" required>
    </label>
    <label>{{ t('change_password_new_label') }}
        <input type="password" name="new_password" required minlength="6">
    </label>
    <button type="submit">{{ t('change_password_submit') }}</button>
</form>

<p><a href="/profile">{{ t('back_to_profile') }}</a></p>
{% endblock %}
