{% if retention_days %}
{% set warning_text = t('message_retention_warning').replace('{days}', retention_days|string) %}
{# Messenger: shown from day 50 to 60 — hover (title) on desktop, tap on phones. #}
<details class="retention-warning">
    <summary title="{{ warning_text }}" aria-label="{{ warning_text }}">!</summary>
    <p>{{ warning_text }}</p>
</details>
{% endif %}
