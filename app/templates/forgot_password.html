{% extends "base.html" %}
{% block title %}{{ t('forgot_password_title') }}{% endblock %}

{% block content %}
<h1>{{ t('forgot_password_title') }}</h1>

<form method="post" action="/forgot-password" class="stacked-form narrow">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>{{ t('forgot_password_email_label') }}
        <input type="email" name="email" required>
    </label>
    {% include "_captcha_fields.html" %}
    <button type="submit">{{ t('forgot_password_submit') }}</button>
</form>

<p><a href="/login">{{ t('back_to_login') }}</a></p>
{% endblock %}
