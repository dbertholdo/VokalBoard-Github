{# Honeypot: field hidden via CSS (.honeypot-field in style.css) —
   humans never see it or fill it in, generic bots fill in everything.
   tabindex="-1" and autocomplete="off" prevent anyone from landing on it
   by accident while tabbing through the form. #}
<div class="honeypot-field" aria-hidden="true">
    <label for="website-field">Website</label>
    <input type="text" id="website-field" name="{{ honeypot_field }}" tabindex="-1" autocomplete="off">
</div>

{% if captcha_enabled %}
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}"></div>
{% endif %}
