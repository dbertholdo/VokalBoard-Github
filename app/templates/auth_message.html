{% extends "base.html" %}
{% block title %}{{ t(title_key) }}{% endblock %}

{% block content %}
{% if show_404_mascot %}
<img class="mascot-inline mascot-inline-lost" src="/static/img/mascot/mascot-alert-zone.png" alt="{{ t('error_404_bird_alt') }}">
{% endif %}
<h1>{{ t(title_key) }}</h1>
<p>{{ message_extra if message_extra else t(message_key) }}</p>
<p><a href="{{ link_url }}">{{ t(link_label_key) }}</a></p>
{% endblock %}
