{% extends "base.html" %}
{% block title %}Rechnungmaker — VokalBoard{% endblock %}
{% block content %}
<section class="card"><h1>Rechnungmaker</h1><p>Gerador avulso: seus dados ficam apenas nesta geração e no PDF baixado.</p>
{% if error %}<p class="form-error">Confira os campos obrigatórios e seus créditos de Rechnung.</p>{% endif %}
<form method="post" action="/rechnungen/pdf" class="form-grid">
<input type="hidden" name="csrf_token" value="{{ csrf_token }}">
<label>Rechnungsnummer<input name="number" value="{{ suggested_number }}" required></label><label>Ausstellungsdatum<input type="date" name="issue_date" value="{{ today }}" required></label><label>Leistungsdatum<input type="date" name="service_date" required></label>
<label>Seu nome<input name="issuer_name" required></label><label>Seu endereço<textarea name="issuer_address" required></textarea></label><label>Steuernummer / USt-IdNr.<input name="issuer_tax_id" required></label>
<label>Destinatário<input name="recipient_name" required></label><label>Endereço do destinatário<textarea name="recipient_address" required></textarea></label><label>Serviço<textarea name="service_description" required></textarea></label>
<label>Valor líquido<input name="net_amount" inputmode="decimal" required></label><label>Moeda<select name="currency"><option>EUR</option><option>CHF</option></select></label><label>IVA %<input name="tax_rate" value="0" inputmode="decimal"></label>
<label>Observação fiscal<textarea name="tax_note" placeholder="Ex.: Kleinunternehmerregelung"></textarea></label><label>Condições de pagamento<textarea name="payment_terms"></textarea></label><label>IBAN<input name="iban"></label><label>BIC<input name="bic"></label>
<button class="button-primary" type="submit">Gerar PDF</button></form></section>
{% endblock %}
