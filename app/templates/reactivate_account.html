{% extends "base.html" %}
{% block title %}{{ t('reactivate_title') }}{% endblock %}

{% block content %}
<h1>{{ t('reactivate_title') }}</h1>
<p>{{ t('reactivate_text') }}</p>

<form method="post" action="/reactivate-account" class="stacked-form narrow">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <button type="submit">{{ t('reactivate_submit') }}</button>
</form>

<p><a href="/login">{{ t('back_to_login') }}</a></p>
{% endblock %}
