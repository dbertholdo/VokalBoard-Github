{% extends "base.html" %}
{% block title %}{{ t('reset_password_title') }}{% endblock %}

{% block content %}
<h1>{{ t('reset_password_title') }}</h1>

{% if error %}<p class="error">{{ t(error) }}</p>{% endif %}

<form method="post" action="/reset-password" class="stacked-form narrow">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <input type="hidden" name="token" value="{{ token }}">
    <label>{{ t('reset_password_new_password_label') }}
        <input type="password" name="password" required minlength="6">
    </label>
    <button type="submit">{{ t('reset_password_submit') }}</button>
</form>
{% endblock %}
