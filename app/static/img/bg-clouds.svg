<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360">
  <!-- mesmo cuidado do bg-leaves.svg: posição fixa num <g> de fora,
       animação (deriva) só no <g> de dentro. -->
  <style>
    .cloud { animation: cloud-drift ease-in-out infinite alternate; }
    .c1 { animation-duration: 22s; animation-delay: 0s; }
    .c2 { animation-duration: 28s; animation-delay: 3s; }
    .c3 { animation-duration: 24s; animation-delay: 1.5s; }
    .c4 { animation-duration: 30s; animation-delay: 4.5s; }
    @keyframes cloud-drift {
      from { transform: translateX(-14px); }
      to   { transform: translateX(14px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud { animation: none; }
    }
  </style>

  <g fill="#edfaf4" stroke="#cdeee0" stroke-width="2">
    <g transform="translate(70,70)">
      <g class="cloud c1">
        <ellipse cx="0" cy="20" rx="34" ry="20"/>
        <ellipse cx="28" cy="8" rx="26" ry="18"/>
        <ellipse cx="58" cy="22" rx="30" ry="19"/>
        <ellipse cx="20" cy="28" rx="40" ry="14"/>
      </g>
    </g>
    <g transform="translate(340,50) scale(1.15)">
      <g class="cloud c2">
        <ellipse cx="0" cy="20" rx="34" ry="20"/>
        <ellipse cx="28" cy="8" rx="26" ry="18"/>
        <ellipse cx="58" cy="22" rx="30" ry="19"/>
        <ellipse cx="20" cy="28" rx="40" ry="14"/>
      </g>
    </g>
    <g transform="translate(160,210) scale(0.85)">
      <g class="cloud c3">
        <ellipse cx="0" cy="20" rx="34" ry="20"/>
        <ellipse cx="28" cy="8" rx="26" ry="18"/>
        <ellipse cx="58" cy="22" rx="30" ry="19"/>
        <ellipse cx="20" cy="28" rx="40" ry="14"/>
      </g>
    </g>
    <g transform="translate(430,250) scale(1.05)">
      <g class="cloud c4">
        <ellipse cx="0" cy="20" rx="34" ry="20"/>
        <ellipse cx="28" cy="8" rx="26" ry="18"/>
        <ellipse cx="58" cy="22" rx="30" ry="19"/>
        <ellipse cx="20" cy="28" rx="40" ry="14"/>
      </g>
    </g>
  </g>
</svg>
