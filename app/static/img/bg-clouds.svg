<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Created 19/09/2026 — this file was referenced by base.html
    (.site-bg.bg-clouds, picked on ~50% of page loads) and by
    style.css but never actually existed on disk, so about half of
    all page loads silently rendered no decorative background at all.
    Same two-<g> nesting pattern as bg-leaves.svg (outer g only
    positions via a fixed transform attribute, inner g only drifts
    via CSS animation — mixing the two would make the animation
    replace the whole transform attribute and lose the position),
    and the same Mineral-palette violet family as the fixed
    bg-leaves.svg stroke, so both backgrounds read as one set.
  -->
  <style>
    .cloud { animation: cloud-drift ease-in-out infinite alternate; }
    .c1 { animation-duration: 11s; animation-delay: 0s; }
    .c2 { animation-duration: 13.5s; animation-delay: 1.2s; }
    .c3 { animation-duration: 10s; animation-delay: 2.4s; }
    .c4 { animation-duration: 14s; animation-delay: .6s; }
    .c5 { animation-duration: 12s; animation-delay: 1.8s; }
    @keyframes cloud-drift {
      from { transform: translateX(-8px); }
      to   { transform: translateX(10px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .cloud { animation: none; }
    }
  </style>

  <g fill="#EEECFC" stroke="#B7AEEE" stroke-width="2">
    <g transform="translate(70,70) scale(1.1)">
      <g class="cloud c1"><path d="M-32,10 a18,18 0 0 1 4,-35 a22,22 0 0 1 42,-6 a18,18 0 0 1 20,26 a16,16 0 0 1 -6,15 Z"/></g>
    </g>
    <g transform="translate(300,40) scale(0.85)">
      <g class="cloud c2"><path d="M-32,10 a18,18 0 0 1 4,-35 a22,22 0 0 1 42,-6 a18,18 0 0 1 20,26 a16,16 0 0 1 -6,15 Z"/></g>
    </g>
    <g transform="translate(500,110) scale(1.2)">
      <g class="cloud c3"><path d="M-32,10 a18,18 0 0 1 4,-35 a22,22 0 0 1 42,-6 a18,18 0 0 1 20,26 a16,16 0 0 1 -6,15 Z"/></g>
    </g>
    <g transform="translate(160,230) scale(0.95)">
      <g class="cloud c4"><path d="M-32,10 a18,18 0 0 1 4,-35 a22,22 0 0 1 42,-6 a18,18 0 0 1 20,26 a16,16 0 0 1 -6,15 Z"/></g>
    </g>
    <g transform="translate(420,280) scale(1.05)">
      <g class="cloud c5"><path d="M-32,10 a18,18 0 0 1 4,-35 a22,22 0 0 1 42,-6 a18,18 0 0 1 20,26 a16,16 0 0 1 -6,15 Z"/></g>
    </g>
  </g>
</svg>
