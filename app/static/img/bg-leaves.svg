<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 420" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <!--
    Cada folha é dois <g> aninhados: o de fora só posiciona
    (translate/rotate/scale fixos, via atributo, nunca tocado pelo
    CSS), o de dentro só balança (a animação CSS mexe só nele). Se
    misturássemos os dois no mesmo elemento, a animação de CSS
    substituiria o atributo transform inteiro (é assim que o CSS
    funciona em cima de SVG) e a posição se perderia.
  -->
  <style>
    .leaf { animation: leaf-sway ease-in-out infinite alternate; }
    .l1 { animation-duration: 6.5s; animation-delay: 0s; }
    .l2 { animation-duration: 8s;   animation-delay: .8s; }
    .l3 { animation-duration: 7.2s; animation-delay: 1.6s; }
    .l4 { animation-duration: 9s;   animation-delay: .3s; }
    .l5 { animation-duration: 6s;   animation-delay: 2.1s; }
    .l6 { animation-duration: 7.8s; animation-delay: 1.1s; }
    .l7 { animation-duration: 8.6s; animation-delay: .6s; }
    .l8 { animation-duration: 6.8s; animation-delay: 1.9s; }
    @keyframes leaf-sway {
      from { transform: rotate(-5deg); }
      to   { transform: rotate(6deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .leaf { animation: none; }
    }
  </style>

  <g fill="#e3f7ee" stroke="#a9dfc7" stroke-width="2">
    <!-- folha-base: parte de (0,0) — o "talo" — e sobe até (0,-40) — a
         ponta; assim cada folha gira em torno do próprio talo. -->
    <g transform="translate(40,100) rotate(-15)">
      <g class="leaf l1"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(150,60) rotate(25) scale(1.3)">
      <g class="leaf l2"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(320,110) rotate(-30) scale(0.9)">
      <g class="leaf l3"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(380,250) rotate(10) scale(1.15)">
      <g class="leaf l4"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(60,250) rotate(40) scale(1.05)">
      <g class="leaf l5"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(210,220) rotate(-50) scale(0.85)">
      <g class="leaf l6"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(130,360) rotate(15) scale(1.2)">
      <g class="leaf l7"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
    <g transform="translate(340,380) rotate(-20) scale(0.95)">
      <g class="leaf l8"><path d="M0,0 C -14,-14 -14,-34 0,-40 C 14,-34 14,-14 0,0 Z"/><path d="M0,-2 L0,-38" stroke-width="1.2"/></g>
    </g>
  </g>
</svg>
