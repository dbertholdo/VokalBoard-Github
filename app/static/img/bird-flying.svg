<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 100">
  <style>
    .vb-wing {
      transform-origin: 82px 44px;
      animation: vb-flap 0.38s ease-in-out infinite alternate;
    }
    @keyframes vb-flap {
      from { transform: rotate(0deg); }
      to   { transform: rotate(24deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .vb-wing { animation: none; transform: rotate(10deg); }
    }
  </style>

  <!-- rabo (leque de penas), atrás do corpo -->
  <g fill="#0f766e">
    <path d="M32 52 L6 40 L24 58 Z"/>
    <path d="M30 60 L4 58 L26 66 Z"/>
    <path d="M32 68 L10 78 L29 72 Z"/>
  </g>

  <!-- corpo -->
  <ellipse cx="70" cy="56" rx="38" ry="30" fill="#5fd0ae"/>
  <circle cx="96" cy="40" r="21" fill="#5fd0ae"/>

  <!-- barriga clara -->
  <ellipse cx="76" cy="66" rx="22" ry="16" fill="#bdf0dc"/>

  <!-- topete -->
  <path d="M84 21 C 86 10, 94 8, 98 14 C 92 14, 90 19, 90 24 Z" fill="#8fe6c6"/>

  <!-- asa (anima batendo, gira em torno do ombro) -->
  <g class="vb-wing">
    <path d="M82 44 C 66 30, 42 26, 24 34 C 40 42, 52 52, 64 58 C 74 58, 80 52, 82 44 Z" fill="#0f766e"/>
  </g>

  <!-- bochecha -->
  <ellipse cx="92" cy="48" rx="7" ry="5" fill="#ffb4b4" opacity="0.85"/>

  <!-- olho -->
  <circle cx="103" cy="35" r="5.2" fill="#1c1f2e"/>
  <circle cx="105" cy="33" r="1.6" fill="#ffffff"/>

  <!-- bico -->
  <path d="M114 34 L131 38 L114 44 Z" fill="#e0a940"/>
  <path d="M114 38 L131 38 L114 44 Z" fill="#c98a2c"/>
</svg>
