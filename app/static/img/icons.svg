<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
  <!-- ============================================================
       VokalBoard's own icon set — plain line icons (stroke, 1.7px,
       round joins) instead of emoji. They all use currentColor, so
       each one automatically matches whatever text color it sits on
       (sidebar rows, banners, buttons) rather than carrying its own
       fixed hue. Kept deliberately simple/geometric so they read as
       part of the site's own visual language, not a borrowed emoji set.
       ============================================================ -->

  <!-- Start / Dashboard: a simple house -->
  <symbol id="icon-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 11.5 12 4l8 7.5"/>
    <path d="M6 10v9a1 1 0 0 0 1 1h10a1 1 0 0 0 1-1v-9"/>
    <path d="M10 20v-5h4v5"/>
  </symbol>

  <!-- Jobs / Board: a music clef-ish note, standing in for "listings" -->
  <symbol id="icon-board" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5l10-2v13"/>
    <circle cx="6.5" cy="18" r="2.5"/>
    <circle cx="16.5" cy="16" r="2.5"/>
  </symbol>

  <!-- My profile: a person -->
  <symbol id="icon-profile" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="8" r="3.5"/>
    <path d="M4.5 20c1.4-4 4-6 7.5-6s6.1 2 7.5 6"/>
  </symbol>

  <!-- My listings: a short document with lines -->
  <symbol id="icon-listings" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="3.5" width="14" height="17" rx="1.5"/>
    <path d="M8.5 8h7M8.5 12h7M8.5 16h4"/>
  </symbol>

  <!-- Favorites: a star -->
  <symbol id="icon-star" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l2.6 5.4 5.9.8-4.3 4.2 1 5.9L12 17l-5.2 2.8 1-5.9-4.3-4.2 5.9-.8z"/>
  </symbol>

  <!-- Back arrow -->
  <symbol id="icon-back" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  </symbol>

  <!-- Users (admin) -->
  <symbol id="icon-users" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="8" r="3"/>
    <path d="M3 19c.9-3.4 3-5 6-5s5.1 1.6 6 5"/>
    <circle cx="17.5" cy="9" r="2.2"/>
    <path d="M15.7 14.3c2.3.3 3.7 1.7 4.3 4.2"/>
  </symbol>

  <!-- Analytics: a bar chart -->
  <symbol id="icon-analytics" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>
  </symbol>

  <!-- Posts: a pencil over a page -->
  <symbol id="icon-posts" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.5h8l4 4V20a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V4.5a1 1 0 0 1 1-1z"/>
    <path d="M9 13.5l6-6 2 2-6 6H9z"/>
  </symbol>

  <!-- Red Zone: a filled warning dot -->
  <symbol id="icon-redzone" viewBox="0 0 24 24" fill="currentColor">
    <circle cx="12" cy="12" r="7"/>
  </symbol>

  <!-- Verify e-mail banner: an envelope -->
  <symbol id="icon-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5.5" width="18" height="13" rx="1.5"/>
    <path d="M3.5 6.5l8.5 6.5 8.5-6.5"/>
  </symbol>

  <!-- Subscription banner: a credit card -->
  <symbol id="icon-card" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="2.5" y="5.5" width="19" height="13" rx="1.8"/>
    <path d="M2.5 9.5h19"/>
    <path d="M6 14.5h4"/>
  </symbol>

  <!-- Insert link -->
  <symbol id="icon-link" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9.5 14.5 14.5 9.5"/>
    <path d="M11 7l1.5-1.5a3.5 3.5 0 0 1 5 5L16 12"/>
    <path d="M13 17l-1.5 1.5a3.5 3.5 0 0 1-5-5L8 12"/>
  </symbol>

  <!-- Insert image -->
  <symbol id="icon-image" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="4.5" width="18" height="15" rx="1.5"/>
    <circle cx="8.5" cy="9.5" r="1.6"/>
    <path d="M4 17.5l5.5-5.5 3.5 3.5 3-3 4 5"/>
  </symbol>

  <!-- Publish (eye open) -->
  <symbol id="icon-eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/>
    <circle cx="12" cy="12" r="2.8"/>
  </symbol>

  <!-- Unpublish (eye with slash) -->
  <symbol id="icon-eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 4l16 16"/>
    <path d="M9.9 6.1A9.8 9.8 0 0 1 12 5.5c6 0 9.5 6.5 9.5 6.5a15 15 0 0 1-3.3 3.9M6.5 7.9C4 9.6 2.5 12 2.5 12s3.5 6.5 9.5 6.5a9.6 9.6 0 0 0 3.1-.5"/>
    <path d="M9.9 10a2.8 2.8 0 0 0 4 4"/>
  </symbol>

  <!-- Delete: a trash can -->
  <symbol id="icon-trash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 7h15"/>
    <path d="M9 7V4.8a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V7"/>
    <path d="M6.5 7 7.3 19a1.5 1.5 0 0 0 1.5 1.4h6.4a1.5 1.5 0 0 0 1.5-1.4L17.5 7"/>
    <path d="M10.3 11v6M13.7 11v6"/>
  </symbol>

  <!-- Success check -->
  <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="9"/>
    <path d="M8 12.3l2.6 2.6L16.3 9"/>
  </symbol>

  <!-- Achievements section heading -->
  <symbol id="icon-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 4.5h10v5a5 5 0 0 1-10 0z"/>
    <path d="M7 6H4.5A2.5 2.5 0 0 0 7 10.5"/>
    <path d="M17 6h2.5A2.5 2.5 0 0 1 17 10.5"/>
    <path d="M12 14.5V18"/>
    <path d="M8.5 19.5h7"/>
    <path d="M9.5 19.5V18a2.5 2.5 0 0 1 5 0v1.5"/>
  </symbol>

  <!-- Tip / hint banners -->
  <symbol id="icon-tip" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18h6"/>
    <path d="M10 21h4"/>
    <path d="M12 3a6 6 0 0 0-3.6 10.8c.6.45 1 1.15 1.1 1.9h5a2.4 2.4 0 0 1 1.1-1.9A6 6 0 0 0 12 3z"/>
  </symbol>

  <!-- Dismiss / close -->
  <symbol id="icon-close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 5l14 14M19 5 5 19"/>
  </symbol>

  <!-- Badge: referrals (gift) -->
  <symbol id="icon-gift" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="9.5" width="17" height="10" rx="1.2"/>
    <path d="M3.5 9.5h17v3.5h-17z"/>
    <path d="M12 9.5V20"/>
    <path d="M12 9.5c-1-3-3-4.5-4.5-3.7-1.5.8-.7 3.7 4.5 3.7z"/>
    <path d="M12 9.5c1-3 3-4.5 4.5-3.7 1.5.8.7 3.7-4.5 3.7z"/>
  </symbol>

  <!-- Badge: fast response (bolt) -->
  <symbol id="icon-bolt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 3 5 13.5h5.5L11 21l8-11h-5.5z"/>
  </symbol>

  <!-- Badge: profile complete (sparkle) -->
  <symbol id="icon-sparkle" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5c.5 3 2 4.5 5 5-3 .5-4.5 2-5 5-.5-3-2-4.5-5-5 3-.5 4.5-2 5-5z"/>
    <path d="M19 15c.3 1.4 1 2.1 2.4 2.4-1.4.3-2.1 1-2.4 2.4-.3-1.4-1-2.1-2.4-2.4 1.4-.3 2.1-1 2.4-2.4z"/>
  </symbol>

  <!-- Badge: anniversary (small cake) -->
  <symbol id="icon-cake" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5v3"/>
    <path d="M12 6.5c-1 0-1-1.4 0-2 1 .6 1 2 0 2z"/>
    <rect x="4" y="12" width="16" height="8" rx="1.3"/>
    <path d="M4 16c1.3-1 2.7 1 4 0s2.7-1 4 0 2.7-1 4 0 2.7-1 4 0"/>
    <path d="M6.5 12V9.5M12 12V9.5M17.5 12V9.5"/>
  </symbol>

  <!-- Location pin -->
  <symbol id="icon-location" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/>
    <circle cx="12" cy="9.5" r="2.4"/>
  </symbol>

  <!-- Microphone -->
  <symbol id="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="9" y="3" width="6" height="11" rx="3"/>
    <path d="M5.5 11a6.5 6.5 0 0 0 13 0"/>
    <path d="M12 17.5V21M9 21h6"/>
  </symbol>

  <!-- Musical note -->
  <symbol id="icon-music" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M9 18V5.5l10-2V16"/>
    <circle cx="6.5" cy="18" r="2.5"/>
    <circle cx="16.5" cy="16" r="2.5"/>
  </symbol>

  <!-- Money / fee (euro coin) -->
  <symbol id="icon-money" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M14.5 8.3a4 4 0 1 0 0 7.4"/>
    <path d="M7.5 10.5h6M7.5 13.5h5"/>
  </symbol>

  <!-- Flag (report) -->
  <symbol id="icon-flag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3v18"/>
    <path d="M6 4.5c3-1.3 5 1.3 8 0v9c-3 1.3-5-1.3-8 0z"/>
  </symbol>

  <!-- Lock -->
  <symbol id="icon-lock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="5" y="11" width="14" height="9" rx="1.5"/>
    <path d="M8 11V8a4 4 0 0 1 8 0v3"/>
  </symbol>

  <!-- Phone -->
  <symbol id="icon-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h3.3l1.3 4.3-2 1.7a12 12 0 0 0 6.4 6.4l1.7-2 4.3 1.3V19a2 2 0 0 1-2.2 2A16 16 0 0 1 3 5.2 2 2 0 0 1 5 4z"/>
  </symbol>

  <!-- Calendar -->
  <symbol id="icon-calendar" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3.5" y="5" width="17" height="15" rx="1.5"/>
    <path d="M3.5 9.5h17M8 3v3.5M16 3v3.5"/>
  </symbol>

  <!-- Church / venue (building) -->
  <symbol id="icon-building" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3v3.5M9.5 5h5"/>
    <path d="M12 6.5 5 12v8.5h14V12z"/>
    <path d="M10 20.5v-5h4v5"/>
  </symbol>

  <!-- Edit (pencil) -->
  <symbol id="icon-edit" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20l.9-3.9L16.6 4.4a1.7 1.7 0 0 1 2.4 0l.6.6a1.7 1.7 0 0 1 0 2.4L7.9 19.1z"/>
    <path d="M14.5 6.5l3 3"/>
  </symbol>

  <!-- Star (outline, for empty/favorite states not yet saved) -->
  <symbol id="icon-star-outline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 3.5l2.7 5.6 6.1.9-4.4 4.3 1 6-5.4-2.9-5.4 2.9 1-6-4.4-4.3 6.1-.9z"/>
  </symbol>

  <!-- Upload -->
  <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 15.5V4M8 8l4-4 4 4"/>
    <path d="M4.5 15.5V19a1.7 1.7 0 0 0 1.7 1.7h11.6a1.7 1.7 0 0 0 1.7-1.7v-3.5"/>
  </symbol>

  <!-- Download -->
  <symbol id="icon-download" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v11.5M8 11.5l4 4 4-4"/>
    <path d="M4.5 15.5V19a1.7 1.7 0 0 0 1.7 1.7h11.6a1.7 1.7 0 0 0 1.7-1.7v-3.5"/>
  </symbol>

  <!-- Save (disk) -->
  <symbol id="icon-save" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 4h11l3 3v13H5z"/>
    <path d="M8 4v5h7V4M8 20v-6h8v6"/>
  </symbol>

  <!-- Globe -->
  <symbol id="icon-globe" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M3.5 12h17M12 3.5c2.4 2.3 3.6 5.2 3.6 8.5s-1.2 6.2-3.6 8.5c-2.4-2.3-3.6-5.2-3.6-8.5S9.6 5.8 12 3.5z"/>
  </symbol>

  <!-- Refresh / recurring -->
  <symbol id="icon-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4.5 12a7.5 7.5 0 0 1 12.6-5.5M19.5 12a7.5 7.5 0 0 1-12.6 5.5"/>
    <path d="M17 3v4h-4M7 21v-4h4"/>
  </symbol>

  <!-- Bank / institution -->
  <symbol id="icon-bank" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M3.5 9.5 12 4.5l8.5 5"/>
    <path d="M4.5 9.5h15V20h-15z"/>
    <path d="M4 20h16M8 12.5V17M12 12.5V17M16 12.5V17"/>
  </symbol>

  <!-- Receipt -->
  <symbol id="icon-receipt" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 3.5h12v17l-2.2-1.5-2.2 1.5-2.1-1.5-2.2 1.5-2.1-1.5-1.2.8z"/>
    <path d="M8.7 8h6.6M8.7 11.5h6.6M8.7 15h4"/>
  </symbol>

  <!-- Book / documentation -->
  <symbol id="icon-book" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 5.5A2 2 0 0 1 6 4h9.5v16H6a2 2 0 0 0-2 1.5z"/>
    <path d="M15.5 4H18a2 2 0 0 1 2 2v14h-8"/>
  </symbol>

  <!-- Scroll / terms -->
  <symbol id="icon-scroll" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 4h11v14a2.5 2.5 0 0 1-2.5 2.5H6.5z"/>
    <path d="M6.5 4a2 2 0 0 0-2 2v12.5a2.5 2.5 0 0 0 2.5 2.5"/>
    <path d="M9.5 9h5M9.5 12.5h5"/>
  </symbol>

  <!-- Confetti / celebration -->
  <symbol id="icon-party" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 20l3-9 6 6z"/>
    <path d="M15 4l1.3 2.6L19 8l-2.6 1.3L15 12l-1.3-2.6L11 8l2.6-1.3z"/>
    <path d="M6 4.5l.8 1.6M19.5 14l.8 1.6M10 3v2"/>
  </symbol>

  <!-- Crown (top referrer / VIP) -->
  <symbol id="icon-crown" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 18h16l-1.3-8-4 3-2.7-5-2.7 5-4-3z"/>
    <path d="M4 20.5h16"/>
  </symbol>

  <!-- Warning / attention -->
  <symbol id="icon-warning" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4 21 19.5H3z"/>
    <path d="M12 10v4"/>
    <circle cx="12" cy="16.7" r="0.15" fill="currentColor" stroke="none"/>
  </symbol>

  <!-- Ban / blocked -->
  <symbol id="icon-ban" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="8.5"/>
    <path d="M6.5 6.5l11 11"/>
  </symbol>

  <!-- Off / permanently deleted -->
  <symbol id="icon-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 4v7"/>
    <path d="M7 6.5a7.5 7.5 0 1 0 10 0"/>
  </symbol>

  <!-- Reply arrow -->
  <symbol id="icon-reply" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 8.5 4.5 13l5.5 4.5v-3.3c6 0 8.5 1.8 9.5 5.3.3-6.3-2.3-10-9.5-10.2z"/>
  </symbol>

  <!-- Menu (hamburger) -->
  <symbol id="icon-menu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 6.5h16M4 12h16M4 17.5h16"/>
  </symbol>

  <!-- Key (password) -->
  <symbol id="icon-key" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="8" cy="15" r="4"/>
    <path d="M11 12 19 4M16.5 6.5 19 4M19 9l2.5-2.5"/>
  </symbol>
</svg>
