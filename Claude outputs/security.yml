name: Security and tests

# Runs on every push and every Pull Request to main — this way, if a
# change accidentally breaks CSRF, the login lockout, /admin
# protection, or HTML escaping, it shows up here BEFORE going live,
# not after. Free on GitHub Actions for repositories like this one.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # can also be run manually, from GitHub's "Actions" tab

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    # A real Postgres, created from scratch just for this run — the
    # tests (tests/test_security.py) run against the real app, with a
    # real database, not a simulation.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vokalboard_ci
          POSTGRES_PASSWORD: vokalboard_ci
          POSTGRES_DB: vokalboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vokalboard_ci -d vokalboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://vokalboard_ci:vokalboard_ci@localhost:5432/vokalboard_ci
      # Key only for this isolated CI run — never used in production.
      SECRET_KEY: ci-key-not-used-in-production-${{ github.run_id }}
      EMAIL_BACKEND: console

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Load the database schema (db/schema.sql)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=vokalboard_ci psql -h localhost -U vokalboard_ci -d vokalboard_ci -f db/schema.sql

      - name: Static security analysis (bandit)
        run: bandit -r app -ll

      - name: Known vulnerabilities in dependencies (pip-audit)
        # continue-on-error: for now this only WARNS (doesn't block
        # the deploy) — Pillow and starlette have known CVEs pending
        # an update with their own tests (see the comment in
        # requirements.txt). Once those are resolved, this line can
        # be removed so pip-audit actually blocks the build.
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Security tests (pytest)
        run: pytest tests/ -v
