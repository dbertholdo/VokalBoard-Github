name: Segurança e testes

# Roda a cada push e a cada Pull Request pro main — assim, se uma
# mudança acidentalmente quebrar CSRF, o bloqueio de login, a proteção
# do /admin ou o escapamento de HTML, aparece aqui ANTES de ir pro ar,
# não depois. Gratuito no GitHub Actions para repositórios como este.
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:  # também dá pra rodar manualmente, pela aba "Actions" do GitHub

jobs:
  security-and-tests:
    runs-on: ubuntu-latest

    # Um Postgres de verdade, criado do zero só pra essa execução —
    # os testes (tests/test_security.py) rodam contra o app real, com
    # banco real, não uma simulação.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vokalboard_ci
          POSTGRES_PASSWORD: vokalboard_ci
          POSTGRES_DB: vokalboard_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vokalboard_ci -d vokalboard_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg2://vokalboard_ci:vokalboard_ci@localhost:5432/vokalboard_ci
      # Chave só pra essa execução isolada do CI — nunca é usada em produção.
      SECRET_KEY: chave-de-ci-nao-usada-em-producao-${{ github.run_id }}
      EMAIL_BACKEND: console

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Carregar o schema do banco (db/schema.sql)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          PGPASSWORD=vokalboard_ci psql -h localhost -U vokalboard_ci -d vokalboard_ci -f db/schema.sql

      - name: Análise estática de segurança (bandit)
        run: bandit -r app -ll

      - name: Vulnerabilidades conhecidas nas dependências (pip-audit)
        # continue-on-error: por enquanto isso só AVISA (não trava o
        # deploy) — Pillow e starlette têm CVEs conhecidas pendentes de
        # uma atualização com testes próprios (ver comentário no
        # requirements.txt). Quando essas forem resolvidas, dá pra
        # tirar essa linha e deixar pip-audit travar o build de verdade.
        run: pip-audit -r requirements.txt
        continue-on-error: true

      - name: Testes de segurança (pytest)
        run: pytest tests/ -v
