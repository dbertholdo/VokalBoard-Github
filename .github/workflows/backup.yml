name: Backup automático do banco

# Roda todo dia de madrugada (03:00 UTC) e faz um "pg_dump" completo
# do banco de PRODUÇÃO, guardando o resultado como artifact do GitHub
# Actions (isso NÃO precisa de nenhum serviço pago novo — já usamos o
# GitHub, e o Actions guarda arquivos de graça, com um prazo de
# retenção configurável — ver "retention-days" abaixo).
#
# Configuração necessária (uma vez só): em Settings -> Secrets and
# variables -> Actions -> "New repository secret", crie um secret
# chamado PRODUCTION_DATABASE_URL com a mesma DATABASE_URL que está
# configurada no Railway (Railway -> seu projeto -> Postgres -> aba
# "Connect" -> "Postgres Connection URL", começa com
# "postgresql://..."). Sem isso, este workflow falha (de propósito —
# melhor falhar visivelmente do que "funcionar" sem backup nenhum).
#
# Pra restaurar um backup: baixe o artifact (aba Actions -> a execução
# desejada -> Artifacts), descompacte, e rode
# `psql "SUA_DATABASE_URL" < backup.sql` (ou peça ajuda — restaurar
# por cima de um banco com dados novos DESDE o backup precisa de
# cuidado, não é um comando pra rodar sem pensar).
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:  # também dá pra disparar na mão, pela aba "Actions"

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente do Postgres
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Checar se o secret está configurado
        run: |
          if [ -z "${{ secrets.PRODUCTION_DATABASE_URL }}" ]; then
            echo "::error::Secret PRODUCTION_DATABASE_URL não configurado — veja o comentário no topo deste arquivo (.github/workflows/backup.yml) pra saber como criar."
            exit 1
          fi

      - name: Rodar pg_dump
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          # A URL do Railway costuma vir no formato "postgresql+psycopg2://..."
          # (formato do SQLAlchemy) — pg_dump quer só "postgresql://...".
          CLEAN_URL=$(echo "$DATABASE_URL" | sed 's/postgresql+psycopg2/postgresql/')
          pg_dump "$CLEAN_URL" --no-owner --no-privileges -F p -f backup.sql
          gzip backup.sql

      - name: Guardar o backup como artifact
        uses: actions/upload-artifact@v4
        with:
          name: vokalboard-backup-${{ github.run_id }}
          path: backup.sql.gz
          # Guarda por 30 dias — ajuste conforme quiser (o GitHub tem
          # um limite de espaço total em artifacts pra contas grátis,
          # então não vale a pena deixar "para sempre").
          retention-days: 30
