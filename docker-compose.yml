services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: maestro_user
      POSTGRES_PASSWORD: maestro_pass
      POSTGRES_DB: maestro_cantor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs automatically the first time the database container starts up:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/seed_sample_data.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro_user -d maestro_cantor"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor
      SECRET_KEY: dev-secret-key-change-in-production
      PORT: 8000
      # CAPTCHA (Cloudflare Turnstile) — optional, empty by default
      # (only the honeypot protects in that case). See .env.example.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    # Não montar ./app por cima da imagem: em pastas sincronizadas do Google
    # Drive, o Docker Desktop pode expor esse bind como diretório vazio e o
    # serviço deixa de importar app.main. Para desenvolver com atualização ao
    # vivo, use uma cópia local fora da pasta sincronizada.

  # Background workers (retention + the 5 added since). Each polls once an
  # hour in a loop (see the `if __name__ == "__main__"` block at the bottom
  # of its module) and locks itself against duplicate runs with
  # pg_try_advisory_xact_lock, so it's safe to have more than one of these
  # running at once during a deploy. Each sits in its own profile so `docker
  # compose up` alone does NOT start any of them — either target one
  # (`docker compose --profile periodic_mail up`) or all six at once
  # (`docker compose --profile workers up`).
  #
  # 19/09/2026: until now only `retention` had a service entry here — the
  # other 5 workers existed as modules but nothing ran them, in dev or in
  # Railway. This closes that gap for local dev/testing. It does NOT by
  # itself make Railway run them: Railway doesn't build from this file, so
  # each worker still needs its own Railway service — see the "Background
  # workers" section in README.md for the exact dashboard steps (new
  # service → same repo → Start Command `python -m app.<worker_name>` → the
  # same env vars as the `web` service).
  retention:
    build: .
    command: ["python", "-m", "app.retention_worker"]
    restart: unless-stopped
    profiles: ["retention", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  invitation_expiry:
    build: .
    command: ["python", "-m", "app.invitation_expiry_worker"]
    restart: unless-stopped
    profiles: ["invitation_expiry", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  match_evaluation_reminder:
    build: .
    command: ["python", "-m", "app.match_evaluation_reminder_worker"]
    restart: unless-stopped
    profiles: ["match_evaluation_reminder", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  invoice_match_draft_expiry:
    build: .
    command: ["python", "-m", "app.invoice_match_draft_expiry_worker"]
    restart: unless-stopped
    profiles: ["invoice_match_draft_expiry", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  urgent_listing_reminder:
    build: .
    command: ["python", "-m", "app.urgent_listing_reminder_worker"]
    restart: unless-stopped
    profiles: ["urgent_listing_reminder", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  periodic_mail:
    build: .
    command: ["python", "-m", "app.periodic_mail_worker"]
    restart: unless-stopped
    profiles: ["periodic_mail", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  listing_reward:
    build: .
    command: ["python", "-m", "app.listing_reward_worker"]
    restart: unless-stopped
    profiles: ["listing_reward", "workers"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor

  # Adminer: web interface to view/edit the database live, without
  # having to write a single line of custom admin code (see the
  # "Administering the site and viewing the database" section in the
  # README). Sits in a separate "profile" ("admin") so it does NOT
  # start on its own with `docker compose up` — only when you
  # explicitly ask for it:
  #   docker compose --profile admin up
  # NEVER expose port 8080 publicly without extra authentication in
  # front (e.g. an SSH tunnel, or a proxy with login) — Adminer alone
  # only has the Postgres password protecting it.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ["admin"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db_data:
