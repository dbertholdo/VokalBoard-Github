services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: maestro_user
      POSTGRES_PASSWORD: maestro_pass
      POSTGRES_DB: maestro_cantor
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
      # Runs automatically the first time the database container starts up:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/1_schema.sql
      - ./db/seed_sample_data.sql:/docker-entrypoint-initdb.d/2_seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maestro_user -d maestro_cantor"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://maestro_user:maestro_pass@db:5432/maestro_cantor
      SECRET_KEY: dev-secret-key-change-in-production
      PORT: 8000
      # CAPTCHA (Cloudflare Turnstile) — optional, empty by default
      # (only the honeypot protects in that case). See .env.example.
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./app:/code/app

  # Adminer: web interface to view/edit the database live, without
  # having to write a single line of custom admin code (see the
  # "Administering the site and viewing the database" section in the
  # README). Sits in a separate "profile" ("admin") so it does NOT
  # start on its own with `docker compose up` — only when you
  # explicitly ask for it:
  #   docker compose --profile admin up
  # NEVER expose port 8080 publicly without extra authentication in
  # front (e.g. an SSH tunnel, or a proxy with login) — Adminer alone
  # only has the Postgres password protecting it.
  adminer:
    image: adminer:latest
    restart: unless-stopped
    profiles: ["admin"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  db_data:
